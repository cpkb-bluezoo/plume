[package]
name = "plume"
version = "0.1.0"
description = "A cross-platform Nostr desktop client"
authors = ["Chris Burdess:"]
license = "GPL-3.0"
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = ["devtools"] }
dirs = "6"
url = "2.5"
bech32 = "0.11"
secp256k1 = { version = "0.29", features = ["global-context"] }
sha2 = "0.10"
mime_guess = "2"
base64 = "0.22"
urlencoding = "2.1"
qrcode = { version = "0.14", features = ["svg"], default-features = false }
aes = "0.8"
cbc = "0.1"
chacha20 = "0.9"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
bytes = "1"
rfd = "0.15"
tauri-plugin-clipboard-manager = "2"
hopf = { version = "0.6", default-features = false, features = ["http", "websocket", "socks"] }
# hopf-core 0.5.0 uses aws-lc-rs ML_DSA/PqdsaKeyPair symbols that only exist from 1.18
# onward, but its own Cargo.toml allows any "1" — pin explicitly so a fresh lockfile
# doesn't resolve a too-old aws-lc-rs and fail to build.
aws-lc-rs = "1.18"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[profile.release]
strip = true
lto = "thin"

