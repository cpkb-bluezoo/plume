[package]
name = "plume"
version = "0.1.0"
description = "A cross-platform Nostr desktop client"
authors = ["Chris Burdess:"]
license = "GPL-3.0"
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = ["devtools"] }
dirs = "6"
url = "2.5"
bech32 = "0.11"
secp256k1 = { version = "0.29", features = ["global-context"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
mime_guess = "2"
base64 = "0.22"
urlencoding = "2.1"
qrcode = { version = "0.14", features = ["svg"], default-features = false }
aes = "0.8"
cbc = "0.1"
chacha20 = "0.9"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
# Custom WebSocket/JSON/HTTP stack dependencies
rustls = { version = "0.23", features = ["ring"], default-features = false }
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
sha1 = "0.10"
bytes = "1"
rfd = "0.15"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[profile.release]
strip = true
lto = "thin"

